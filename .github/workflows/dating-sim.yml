              if (match) {
                choice = match[1].toUpperCase();
              }
            }
            
            // ゲーム開始
            if (context.payload.action === 'opened' || context.payload.action === 'labeled') {
              const scene = gameData.scenes.start;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: scene.text + '\n\n' + scene.choices.map(c => 
                  `**選択肢 ${c.id}**: ${c.text}`
                ).join('\n') + '\n\n---\n💬 コメントで「選択肢：A」のように答えてください！'
              });
              return;
            }
            
            // 選択肢の処理
            if (choice && context.payload.action === 'created') {
              // 現在のシーンを特定（最後のBotコメントから）
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              
              // シーンを進める処理
              // （簡略化のため、startシーンからの選択として処理）
              const currentScene = gameData.scenes.start;
              const selectedChoice = currentScene.choices.find(c => c.id === choice);
              
              if (selectedChoice) {
                const nextScene = gameData.scenes[selectedChoice.next];
                if (nextScene) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    body: nextScene.text + '\n\n' + 
                          (nextScene.choices ? nextScene.choices.map(c => 
                            `**選択肢 ${c.id}**: ${c.text}`
                          ).join('\n') + '\n\n---\n💬 次の選択をしてください！' : '')

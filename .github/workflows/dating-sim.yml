# .github/workflows/dating-sim.yml
name: "💝 Dating Sim Game"

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'game') || startsWith(github.event.issue.title, '[GAME]')
    
    steps:
      - name: Game Engine
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            console.log('🎮 Game started!');
            
            const scenes = {
              start: {
                text: `# 💝 Code Love Story
            

            ようこそ、TechStartup社へ！
            ━━━━━━━━━━━━━━━━━━━━━━
            
            あなたは新人エンジニアとして入社した。
            初出社の朝、オフィスで3人の女性エンジニアと出会う...
            
            ---
            
            ## 👋 出会い
            
            「おはよう！新人さん？」
            
            明るい声が聞こえた。振り向くと...
            
            \`\`\`
              ∧＿∧
             (* ﾟ∀ﾟ)  < 私はさくら！同期だよ
             /    つ
            しーJ
            \`\`\`
            
            **さくら・デバッグ** (同期エンジニア)
            元気で明るい性格。一緒に成長していける！
            
            ---
            
            その隣には...
            
            \`\`\`
              ∧＿∧
             (  ･ω･)  < 私はアリス。先輩だよ
             /    つ
            しーJ
            \`\`\`
            
            **アリス・コードウェル** (先輩エンジニア)
            優しくて面倒見がいい。コードレビューが丁寧。
            
            ---
            
            そして、奥から凛とした女性が...
            
            \`\`\`
              ∧＿∧
             (  ･_･)  < 凛だ。技術リードをしている
             /    つ📐
            しーJ
            \`\`\`
            
            **凛・アーキテクト** (技術リード)
            クールで完璧主義。でも実は優しい。
            
            ━━━━━━━━━━━━━━━━━━━━━━
            
            さて、最初に話しかけるのは...？`,
                choices: [
                  { id: 'A', text: '😊 さくらに元気よく挨拶', next: 'sakura1' },
                  { id: 'B', text: '🌟 アリスに丁寧に挨拶', next: 'alice1' },
                  { id: 'C', text: '💎 凛にしっかり挨拶', next: 'rin1' }
                ]
              },
              
              sakura1: {
                text: `## 🌸 さくらルート - Day 1
            
            「よろしくお願いします！」
            
            あなたの元気な挨拶に、さくらの笑顔が輝いた。
            
            \`\`\`
              ∧＿∧
             (*ﾟ∀ﾟ*)  < その意気だね！一緒に頑張ろう！
             /    つ🎉
            しーJ
            \`\`\`
            
            「ねえねえ、今日のタスク一緒にやらない？
             実は私、まだちょっと不安で...」
            
            さくらは少し照れくさそうに言った。
            
            ━━━━━━━━━━━━━━━━━━━━━━
            📊 **好感度アップ！** さくら: +10 ❤️
            ━━━━━━━━━━━━━━━━━━━━━━`,
                choices: [
                  { id: 'A', text: '😄 もちろん！一緒にやろう', next: 'sakura2' },
                  { id: 'B', text: '🤝 お互い助け合おう', next: 'sakura2' },
                  { id: 'C', text: '😅 まずは一人でやってみる', next: 'neutral' }
                ]
              },
              
              alice1: {
                text: `## 💻 アリスルート - Day 1
            
            「はじめまして。よろしくお願いします」
            
            落ち着いた挨拶に、アリスは優しく微笑んだ。
            
            \`\`\`
              ∧＿∧
             (  ･ω･)  < しっかりしてるね。期待できそう
             /    つ☕
            しーJ
            \`\`\`
            
            「環境構築、一緒にやろうか？
             詰まったところがあったら、いつでも聞いてね」
            
            アリスの声は穏やかで安心感がある。
            
            ━━━━━━━━━━━━━━━━━━━━━━
            📊 **好感度アップ！** アリス: +10 ❤️
            ━━━━━━━━━━━━━━━━━━━━━━`,
                choices: [
                  { id: 'A', text: '🙏 お願いします！', next: 'alice2' },
                  { id: 'B', text: '📚 少しだけヒントください', next: 'alice2' },
                  { id: 'C', text: '💪 自分で頑張ります', next: 'neutral' }
                ]
              },
              
              rin1: {
                text: `## 💎 凛ルート - Day 1
            
            「よろしくお願いします」
            
            あなたのしっかりした挨拶に、凛は少し驚いた様子。
            
            \`\`\`
              ∧＿∧
             (  ･_･)  < ...礼儀正しいね。悪くない
             /    つ
            しーJ
            \`\`\`
            
            「まずはコーディング規約を読んで。
             私のチームでは、品質には一切妥協しない」
            
            凛の視線は厳しいが、どこか期待も感じる。
            
            ━━━━━━━━━━━━━━━━━━━━━━
            📊 **好感度アップ！** 凛: +10 ❤️
            ━━━━━━━━━━━━━━━━━━━━━━`,
                choices: [
                  { id: 'A', text: '🔥 はい、しっかり学びます！', next: 'rin2' },
                  { id: 'B', text: '📖 質問してもいいですか？', next: 'rin2' },
                  { id: 'C', text: '😰 頑張ります...', next: 'neutral' }
                ]
              },
              
              sakura2: {
                text: `## 🌸 さくらルート - 1週間後
            
            さくらとのペアワークは順調だ。
            
            \`\`\`
              ∧＿∧
             (* ﾟ∀ﾟ)  < あなたと一緒だと、楽しいな！
             /    つ💕
            しーJ
            \`\`\`
            
            「ねえ、今度の休日さ...
             ハッカソン一緒に出ない？二人なら優勝できそう！」
            
            ━━━━━━━━━━━━━━━━━━━━━━
            💕 **GOOD ENDING - さくらルート**
            
            あなたとさくらは最強のペアに！
            ハッカソンで優勝し、二人で起業した。
            
            🏆 スタートアップ成功
            💰 資金調達: $5M
            ⭐ GitHub Stars: 10,000+
            
            \`さくらとの幸せな開発ライフ\`
            ━━━━━━━━━━━━━━━━━━━━━━
            
            🎊 **CONGRATULATIONS!**
            🎮 もう一度プレイするには新しいIssueを作成してね！`,
                choices: []
              },
              
              alice2: {
                text: `## 💻 アリスルート - 2週間後
            
            アリスとのコードレビューは刺激的だ。
            
            \`\`\`
              ∧＿∧
             (  ･ω･*)  < あなたのコード、すごく読みやすい
             /    つ✨
            しーJ
            \`\`\`
            
            「実は... 今度技術書の出版社から声がかかってて。
             共著で書きませんか？あなたとなら、いい本が書けそう」
            
            ━━━━━━━━━━━━━━━━━━━━━━
            💕 **TRUE ENDING - アリスルート**
            
            あなたとアリスは共著で技術書を出版！
            
            📚 「美しいコードの書き方」
            ⭐ Amazon評価: 4.8/5.0
            📊 販売部数: 50,000冊
            🎤 Tech Conference登壇: 10回
            
            \`アリスとの完璧なパートナーシップ\`
            ━━━━━━━━━━━━━━━━━━━━━━
            
            🎊 **TRUE END UNLOCKED!**
            🎮 もう一度プレイするには新しいIssueを作成してね！`,
                choices: []
              },
              
              rin2: {
                text: `## 💎 凛ルート - 1ヶ月後
            
            凛のコードレビューは厳しかった。
            でも、あなたは成長した。
            
            \`\`\`
              ∧＿∧
             (  ･_･)  < ...認めよう。君は本物だ
             /    つ🏆
            しーJ
            \`\`\`
            
            「新アーキテクチャの設計、一緒にやらないか。
             君なら... 私の理想を理解してくれる」
            
            凛が初めて見せた、本当の笑顔。
            
            ━━━━━━━━━━━━━━━━━━━━━━
            💕 **TRUE ENDING - 凛ルート**
            
            あなたと凛は革新的なアーキテクチャを設計！
            
            🏗️ 「Zero-Downtime Migration」
            🌟 業界標準として採用
            📰 Tech雑誌の表紙を飾る
            💼 ともにCTOに昇進
            
            \`凛との完璧な技術パートナーシップ\`
            ━━━━━━━━━━━━━━━━━━━━━━
            
            🎊 **TRUE END UNLOCKED!**
            🎮 もう一度プレイするには新しいIssueを作成してね！`,
                choices: []
              },
              
              neutral: {
                text: `## 😐 ノーマルエンド
            
            あなたは無難に仕事をこなした。
            特に親しい関係は築けなかったが、
            悪くない会社員生活を送っている。
            
            ━━━━━━━━━━━━━━━━━━━━━━
            📊 **NORMAL ENDING**
            
            普通の開発者として平和に過ごした。
            
            🎮 もう一度挑戦してみる？
            別のルートで違うエンディングが見られるかも！
            ━━━━━━━━━━━━━━━━━━━━━━`,
                choices: []
              }
            };
            
            const issueNumber = context.issue.number;
            const isNewGame = context.payload.action === 'opened';
            const comment = context.payload.comment?.body || '';
            
            if (isNewGame) {
              console.log('New game started!');
              const scene = scenes.start;
              const choicesText = scene.choices.map(c => 
                `**選択肢 ${c.id}**: ${c.text}`
              ).join('\n');
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `${scene.text}\n\n━━━━━━━━━━━━━━━━━━━━━━\n\n${choicesText}\n\n━━━━━━━━━━━━━━━━━━━━━━\n\n💬 **コメントで選択してください！**\n例: \`選択肢：A\` または \`A\``
              });
              return;
            }
            
            const choiceMatch = comment.match(/選択肢[：:]\s*([ABC])/i) || 
                               comment.match(/^([ABC])$/i) ||
                               comment.match(/\[([ABC)]\]/i);
            
            if (!choiceMatch) {
              console.log('No valid choice found');
              return;
            }
            
            const choice = choiceMatch[1].toUpperCase();
            console.log(`Choice selected: ${choice}`);
            
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });
            
            let currentSceneKey = 'start';
            const botComments = comments.data.filter(c => c.user.type === 'Bot');
            if (botComments.length > 0) {
              const lastComment = botComments[botComments.length - 1].body;
              if (lastComment.includes('さくらルート - Day 1')) currentSceneKey = 'sakura1';
              else if (lastComment.includes('アリスルート - Day 1')) currentSceneKey = 'alice1';
              else if (lastComment.includes('凛ルート - Day 1')) currentSceneKey = 'rin1';
            }
            
            const currentScene = scenes[currentSceneKey];
            if (!currentScene) {
              console.log('Scene not found');
              return;
            }
            
            const selectedChoice = currentScene.choices.find(c => c.id === choice);
            if (!selectedChoice) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: '❌ 無効な選択肢です。A、B、C のいずれかを選んでください。'
              });
              return;
            }
            
            const nextScene = scenes[selectedChoice.next];
            if (!nextScene) {
              console.log('Next scene not found');
              return;
            }
            
            const choicesText = nextScene.choices.length > 0 ? 
              '\n\n━━━━━━━━━━━━━━━━━━━━━━\n\n' +
              nextScene.choices.map(c => `**選択肢 ${c.id}**: ${c.text}`).join('\n') +
              '\n\n━━━━━━━━━━━━━━━━━━━━━━\n\n💬 **次の選択をしてください！**' : '';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: nextScene.text + choicesText
            });
            
            console.log('Scene updated successfully!');
                    let favText = '\n\n📊 **好感度の変化**\n';
                    for (const [char, value] of Object.entries(selectedChoice.effects)) {
                      favText += `- ${gameData.characters[char].name}: ${value > 0 ? '+' : ''}${value}\n`;
                    }
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNumber,
                      body: favText
                    });
